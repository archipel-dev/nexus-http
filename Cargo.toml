[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.91"
repository = "https://github.com/archipel-dev/nexus-http"

[workspace.dependencies]
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2"
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles"] }
archipel-sdk = { git = "https://github.com/archipel-dev/sdk", branch = "main" }
archipel-kit = { git = "https://github.com/archipel-dev/kit", branch = "main" }
nexus-http-core = { path = "crates/nexus-http-core" }
nexus-http = { path = "crates/nexus-http" }
tempfile = "3"
tiny_http = "0.12"
tungstenite = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
